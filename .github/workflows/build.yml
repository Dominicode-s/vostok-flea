name: Build VMZ

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read mod version
        id: version
        run: |
          VERSION=$(grep '^version=' mod.txt | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # A VMZ is a zip of mod.txt + mods/ with the extension changed. The spike
      # and the tooling are deliberately excluded: they are development
      # scaffolding, not part of what players install.
      - name: Build VMZ
        run: zip -r "Vostok-Flea-Market.vmz" mod.txt mods/

      # Guards the mistake that has actually bitten here. The archive must use
      # forward slashes (the loader rejects Windows backslash paths as BAD ZIP),
      # and both fixture scenes must be present -- the placed furniture cannot
      # resolve without them.
      - name: Verify the archive
        run: |
          unzip -l Vostok-Flea-Market.vmz
          if unzip -l Vostok-Flea-Market.vmz | grep -q '\'; then
            echo "::error::archive contains backslash paths; the mod loader will reject it"
            exit 1
          fi
          for f in mod.txt mods/FleaMarket/Main.gd \
                   mods/FleaMarket/FleaTerminal_F.tscn \
                   mods/FleaMarket/CourierCrate_F.tscn; do
            unzip -l Vostok-Flea-Market.vmz | grep -q "$f" \
              || { echo "::error::missing $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Vostok-Flea-Market-v${{ steps.version.outputs.version }}
          path: Vostok-Flea-Market.vmz

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          NOTES=$(awk '/^### /{if(found) exit; found=1; next} found' CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vostok Flea Market ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: Vostok-Flea-Market.vmz
